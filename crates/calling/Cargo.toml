[package]
name = "calling"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
cpal = "0.17"
chatsvc.workspace = true
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
futures-util.workspace = true
libwebrtc = { version = "=0.3.51", features = ["glib-main-loop"] }
deep_filter = { path = "../../vendor/deep_filter" }
ndarray = "0.17"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
zune-core = "0.5"
zune-jpeg = "0.5"
serde.workspace = true
webrtc-sys = "=0.3.48"
serde_json.workspace = true
session.workspace = true
thiserror.workspace = true
tract-onnx = "0.23"
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(windows))'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-31"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-31", "directml"] }
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSProcessInfo", "NSString", "NSValue"] }
objc2-screen-capture-kit = "0.3"

[build-dependencies]
flate2 = "1"

[target.'cfg(windows)'.dev-dependencies]
webview.workspace = true

[dev-dependencies]
tempfile.workspace = true
